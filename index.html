if(s==='shop'){const t=shopTotal();h=hdr()+`<h1>Segunda: compras</h1><p class="mu">Cada item é comprado em um lugar da cidade. Escolham quanto levar. As opções que não cabem no saldo ficam apagadas.</p>`;
SHOP.forEach((c,i)=>{h+=`<div class="c"><div class="row"><b class="t" style="font-size:24px">${c[0]}</b><span class="chip">📍 ${c[2][0]}</span></div><div class="mu">${c[2][1]}</div><div class="og">`;c[1].forEach((o,j)=>{const nt=t-pr(c[1][G.pick[i]])+pr(o),no=nt>G.saldo;h+=`<button class="oc ${G.pick[i]===j?'on':'s'}" ${no?'disabled':''} onclick="pk(${i},${j})"><span class="oi">${o[4]}</span><b>${o[0]}</b><span class="px">${m(pr(o))}</span></button>`});h+='</div></div>'});
h+=`<div class="hd c row"><span>Total: <b>${m(t)}</b></span><span class="mu">Sobra: ${m(G.saldo-t)}</span></div><button onclick="conf()">Ir para o pagamento</button>`}
if(s==='pag'){h=hdr()+`<h1>Pagamento das compras</h1><div class="c">Total: <b>${m(G.tot)}</b><br><span class="mu">Limite de crédito: ${m(G.lim)} · já usado: ${m(G.cred)}</span></div><div class="c q"><b>O que é carnê?</b> É o papel com as parcelas que a loja entrega. Muita loja da cidade ainda vende assim. Quem atrasa paga multa e juros. O que for no carnê e no crediário usa o limite e é cobrado no domingo.</div>`+PAY.map((p,k)=>{const tt=R2(G.tot*(1+p[1])),cr=k===0?0:k===1?R2(tt-tt/3):tt,no=cr>G.lim-G.cred;return `<button class="w s oe" ${no?'disabled':''} onclick="pagar(${k})"><span class="oi">${ico(p[0])}</span><span style="flex:1">${p[0]}${no?'<br><span class="mu">Passa do limite de crédito</span>':''}</span></button>`}).join('')}
if(s==='day'){const e=EV();h=hdr()+`<div class="c"><h1>🎲 ${e[1]}</h1><p>${e[2]}</p></div><h2>Conversem e decidam</h2>`;
vis().forEach((o,k)=>{const x=o[6]&&o[6].base,d=oc(o);h+=`<button class="w s oe" onclick="esc(${k})"><span class="oi">${ico(o[0])}</span><span style="flex:1">${o[0]}</span><span class="chip">${x?'💡 calcule':d?m(d):'Sem custo'}</span></button>`});h+=`<p class="mu">Se o saldo não cobrir, a conta vai para o crediário (+10%, cobrado no domingo). Se o limite acabar, vai para a caderneta (+10%).</p>`}
if(s==='res'){const r=G.res,pend=r.q&&!r.q.d;h=hdr()+`<div class="c"><h2>Resultado</h2><p>${r.l}</p><p>Dinheiro: <b class="${r.d<0?'bad':'ok'}">${r.d>0?'+':''}${m(r.d)}</b>${r.cr?`<br>Vai para a fatura de domingo: <b class="bad">${m(r.cr)}</b>`:''}${r.par?`<br>Parcelas que vencem no domingo: <b class="bad">${m(r.par)}</b>`:''}${r.pg?'':`<br>Saúde: <b>${r.s>0?'+':''}${r.s} ❤️</b> · Bem-estar: <b>${r.b>0?'+':''}${r.b} 😊</b>`}</p>${r.n?`<p class="bad">${r.n}</p>`:''}${r.fi===1?`<p class="bad">Sem saldo, foi no crediário: o limite que sobrou é ${m(G.lim-G.cred)}. Quem tem menos paga mais.</p>`:r.fi===2?`<p class="bad">Sem saldo e sem limite: foi na caderneta (fiado). Quem tem menos paga mais caro.</p>`:''}
${r.pg||r.fi?'':r.ok?'<p class="ok">✅ Foi a melhor escolha possível para o orçamento de vocês.</p>':`<p class="mu">💬 Com o dinheiro que vocês tinham, outra opção também cabia: <b>${r.alt}</b>. Cada família decide com o que tem.</p>`}</div>${quiz(r.q)}
${r.pg?'':`<div class="c q"><b>Pensem juntos:</b><br>${EV()[4]}</div>`}<button ${pend?'disabled':''} onclick="nxt()">${G.day===6?'Ir para domingo':G.day===1?'Ir para terça':'Próximo dia'}</button>`}
if(s==='fim'){const v=G.saldo;h=hdr()+`<div class="c"><h1>Domingo: fechando a semana</h1>${G.fat?`<p class="bad">Hoje foi cobrada a fatura do crediário e do carnê: <b>${m(G.fat)}</b>.</p>`:''}<p>${v>0?`Sobraram <b>${m(v)}</b>. O que a família faz?`:`A semana terminou no vermelho: <b class="bad">${m(v)}</b>.`}</p></div>`+(v>0?['Guardar tudo na poupança','Guardar metade e se divertir','Gastar tudo em lazer'].map((l,k)=>`<button class="w s" onclick="fim(${k})">${l}</button>`).join(''):`<button onclick="fim(3)">Continuar</button>`)}
if(s==='prob'){h=`<h1>Elaborem um problema</h1><div class="c q">Usem algo que aconteceu na semana de vocês e criem um <b>problema de porcentagem</b> (desconto, acréscimo, juros). Escrevam o problema e a resposta.</div><textarea id="pb" rows="6" placeholder="Ex.: Uma conta de R$ 150 atrasou e teve acréscimo de 10%..."></textarea><button onclick="probSave()">Enviar ao professor</button>`}
if(s==='end'){const[b,aj]=ptsOf(),tot=G.time.reduce((a,x)=>a+x,0),mx=Math.max(500,...G.hist.map(x=>Math.abs(x[1])));
h=`<h1>${G.nome}: resultado</h1><div class="big">${aj} pontos</div><p class="mu" style="text-align:center">Pontos ajustados às condições de partida (brutos: ${b}).</p>
<div class="c row"><span>❤️ Saúde<br><b>${G.saude}</b></span><span>😊 Bem-estar<br><b>${G.bem}</b></span><span>🏦 Reserva<br><b>${m(G.reserva)}</b></span><span>💸 Juros<br><b class="${G.juros?'bad':''}">${m(G.juros)}</b></span><span>🧮 Contas<br><b>${G.ac}/${G.qt}</b></span></div>
<details class="c"><summary><b>Legenda dos marcadores</b></summary>${LEG}</details><h2>⏱ Tempo em cada fase</h2><div class="c">${G.time.map((t,i)=>`<div class="row"><span>${DIAS[i]}</span><b>${fmt(t)}</b></div>`).join('')}<hr style="border:0;border-top:1px solid var(--bd)"><div class="row"><b>Tempo total</b><b>${fmt(tot)}</b></div></div>
<h2>Dinheiro ao longo da semana</h2><div class="c">${G.hist.map(x=>`<div style="margin:8px 0"><div class="row"><span>${x[0]}</span><b class="${x[1]<0?'bad':''}">${m(x[1])}</b></div><div class="bar ${x[1]<0?'n':''}" style="width:${Math.min(100,Math.abs(x[1])/mx*100)}%"></div></div>`).join('')}</div>
<h2>Suas decisões</h2><div class="c">${G.log.map(l=>`<p style="margin:6px 0"><b>${DIAS[l[0]-1]}:</b> ${l[1]}<br><span class="mu">${l[2]}${l[3]?' ('+m(l[3])+')':''}</span></p>`).join('')}</div>
<div class="c q"><b>Para a roda de conversa:</b><br>Vocês partiram de ${m(C.ini)} para a semana. Todas as famílias partiram do mesmo lugar? Quais imprevistos pesaram mais para vocês do que para outras famílias? Quem tinha ajuda, reserva ou direitos que facilitaram a semana? Uma escolha barata é sempre uma escolha ruim?</div>`}
return h}
function draw(){if(PROF)return drawProf();document.getElementById('app').innerHTML=G?drawG():drawEnt()}
/* ---------- Painel do professor ---------- */
let pSala='',pOn=false,pRef=null,pGs=[];
/* Desenhos do painel: coloque aqui caminhos de imagens do repositório (ex.: 'img/mercado.png') ou use o botão "+ adicionar desenho" no próprio painel */
const IMG_ESQ=[],IMG_DIR=[];
const lk=()=>location.href.split('?')[0]+'?sala='+pSala;
function imgs(k){let a=(k==='e'?IMG_ESQ:IMG_DIR).slice();try{a=a.concat(JSON.parse(ls('mv_i'+k)||'[]'))}catch(e){}return a}
function side(k){const a=imgs(k),art=k==='e'?[['🛒','Compras'],['🚌','Transporte'],['🏠','Moradia']]:[['💊','Saúde'],['💡','Contas'],['🧮','Porcentagem']];
return (a.length?a.map((u,i)=>`<img src="${u}" alt="" style="width:100%;border-radius:14px;margin-bottom:10px;cursor:pointer" onclick="rmImg('${k}',${i})">`).join(''):art.map(x=>`<div class="c" style="text-align:center"><div style="font-size:64px">${x[0]}</div><b>${x[1]}</b></div>`).join(''))+`<label class="mu" style="cursor:pointer;display:block">+ adicionar desenho<input type="file" accept="image/*" hidden onchange="addImg('${k}',this)"></label>`}
function sides(){document.getElementById('se').innerHTML=side('e');document.getElementById('sd').innerHTML=side('d')}
function addImg(k,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=Math.min(1,420/im.width),c=document.createElement('canvas');c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let a=[];try{a=JSON.parse(ls('mv_i'+k)||'[]')}catch(e){}a.push(c.toDataURL('image/jpeg',.8));ls('mv_i'+k,JSON.stringify(a));sides()};im.src=r.result};r.readAsDataURL(f)}
function rmImg(k,i){const b=(k==='e'?IMG_ESQ:IMG_DIR).length;if(i<b||!confirm('Remover este desenho?'))return;let a=[];try{a=JSON.parse(ls('mv_i'+k)||'[]')}catch(e){}a.splice(i-b,1);ls('mv_i'+k,JSON.stringify(a));sides()}
function bigQR(){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;cursor:pointer';const z=Math.floor(Math.min(innerWidth,innerHeight)*.65);
o.innerHTML=`<div id="bq"></div><div style="font-size:48px;font-weight:800;margin-top:14px">Sala ${pSala}</div><div style="font-size:18px;margin-top:6px;padding:0 20px;text-align:center;word-break:break-all">${lk()}</div><div style="margin-top:10px;color:#666">Toque para fechar</div>`;o.onclick=()=>o.remove();document.body.appendChild(o);new QRCode(document.getElementById('bq'),{text:lk(),width:z,height:z})}
function drawProf(){const a=document.getElementById('app');a.classList.add('prof');if(!ONLINE){a.innerHTML='<h1>Painel do professor</h1><div class="c bad">Configure o Firebase no começo do arquivo (CONFIG) para usar o painel.</div>';return}
if(!pOn){pOn=true;pSala=ls('mv_ps')||String(Math.floor(1000+Math.random()*9000));ls('mv_ps',pSala);
a.innerHTML=`<div id="pg"><aside id="se"></aside><section><h1>📅 Uma Semana em Açailândia</h1>
<div class="c row"><div><div class="mu">Código da sala</div><div class="big" style="text-align:left">${pSala}</div><div class="mu" style="word-break:break-all">${lk()}</div><p><button onclick="bigQR()">🔍 Ampliar QR code</button> <button class="s" onclick="resetSala()">Limpar grupos</button> <button class="s" onclick="novaSala()">Nova sala</button></p></div><div id="pq" onclick="bigQR()" style="cursor:zoom-in"></div></div>
<details class="c" open><summary><b>Como funciona o jogo</b></summary><ol><li>Cada grupo cria a sua família e recebe condições sorteadas: trabalho, moradia, dívidas, reserva e saúde.</li><li><b>Segunda:</b> compras da semana e forma de pagamento (desconto à vista, parcelas com juros).</li><li><b>Terça a sábado:</b> um evento por dia, com decisões e contas de porcentagem. Se o saldo não cobre, vai para o fiado (+10%).</li><li><b>Domingo:</b> fechamento da semana, reserva e elaboração de um problema de porcentagem.</li><li><b>Pontuação:</b> saúde, bem-estar, reserva, juros pagos e acertos nas contas, ajustada pelas condições de partida de cada família.</li></ol>
<p class="mu">Habilidades: EF07MA02 (acréscimos e decréscimos simples, cálculo mental e calculadora, educação financeira) e EF08MA04 (porcentagens com tecnologias digitais). Tempo previsto: 2 aulas de 50 minutos.</p></details>
<details class="c"><summary><b>Dicas para a aula</b></summary><ul><li>Projete esta tela e toque no QR code para ampliar.</li><li>Os alunos não veem o cronômetro; o tempo aparece aqui e no resultado final.</li><li>Na roda final, compare as condições de partida de cada grupo e discuta por que a mesma decisão pesa diferente para cada família.</li><li>Toque em um desenho para removê-lo.</li></ul></details>
<details class="c"><summary><b>Lugares do jogo (Açailândia)</b></summary>${LUG}</details><details class="c"><summary><b>Legenda dos marcadores</b></summary>${LEG}</details><h2 id="pt">Grupos</h2><div id="pl"></div></section><aside id="sd"></aside></div>`;
sides();new QRCode(document.getElementById('pq'),{text:lk(),width:150,height:150});
if(pRef)pRef.off();pRef=db.ref('mv/'+pSala+'/grupos');pRef.on('value',sn=>{pGs=Object.values(sn.val()||{}).map(g=>{try{return norm(g)}catch(e){return null}}).filter(Boolean);listaGs()})}}
function listaGs(){const pt=document.getElementById('pt'),pl=document.getElementById('pl');if(!pt||!pl)return;pt.textContent=`Grupos (${pGs.length}) · concluídos: ${pGs.filter(g=>g.step==='end').length}`;pl.innerHTML=pGs.map(card).join('')||'<p class="mu">Aguardando grupos…</p>'}
setInterval(()=>{if(pOn)listaGs()},30000);
function resetSala(){if(confirm('Remover TODOS os grupos desta sala? Quem estiver jogando volta para a tela inicial.'))db.ref('mv/'+pSala+'/grupos').remove()}
function novaSala(){if(!confirm('Criar uma nova sala? Os alunos vão precisar do novo QR code.'))return;const old=pSala;if(confirm('Apagar também os dados da sala anterior?'))db.ref('mv/'+old).remove();ls('mv_ps',String(Math.floor(1000+Math.random()*9000)));pOn=false;drawProf()}
function remGrupo(c){if(confirm('Remover este grupo?'))db.ref('mv/'+pSala+'/grupos/'+c).remove()}
function pts(g){const b=g.saude*8+g.bem*4+Math.floor(g.reserva/10)-Math.floor(g.juros/5)+g.ac*5+g.bo*3-(g.saldo<0?20:0);return[b,Math.round(b*(500/g.cond.ini))]}
function card(g){const C=g.cond,[b,aj]=pts(g),fim=g.step==='end',tot=g.time.reduce((a,x)=>a+x,0)+(fim||!g.t?0:Date.now()-g.t),n=Object.keys(g.membros).length,min=g.upd?Math.round((Date.now()-g.upd)/60000):0,ina=!fim&&min>=10;
const st=ina?`⚠️ sem atividade há ${min} min`:fim?'✅ concluído':g.step==='perfil'?'lendo o perfil':g.step==='prob'?'elaborando problema':`dia ${g.day} de 7`;
return `<div class="c"><div class="row"><b>${g.nome} <span class="mu">(${g.cod} · ${n} aluno${n>1?'s':''})</span></b><span class="${ina?'bad':'mu'}">${st}</span></div>
<div class="row px" style="margin-top:8px"><span>${m(g.saldo)}</span><span>❤️${g.saude}</span><span>😊${g.bem}</span><span>🏦${m(g.reserva)}</span><span>💸${m(g.juros)}</span><span>💳${m((g.lim||0)-(g.cred||0))}</span><span>🧮${g.ac}/${g.qt}</span><span>⏱${fmt(tot)}</span><b>${aj} PTS</b></div>
<details><summary class="mu">Condições, tempos e decisões</summary><p class="mu">Família: ${C.pe}; ${C.t}; ${C.mo}; ${C.dv}; ${C.rs}; ${C.sa}. Sobra inicial: ${m(C.ini)}. Limite: ${m(C.lim||0)}.</p>
<table>${g.time.map((t,i)=>t?`<tr><td>${DIAS[i]}</td><td>${fmt(t)}</td></tr>`:'').join('')}</table>
${g.log.map(l=>`<p style="margin:4px 0"><b>${DIAS[l[0]-1]}:</b> ${l[2]}</p>`).join('')}${g.prob?`<p class="q"><b>Problema elaborado:</b><br>${String(g.prob).replace(/</g,'&lt;')}</p>`:''}</details>
<p><button class="s" style="min-height:36px;font-size:15px" onclick="remGrupo('${g.cod}')">Remover grupo</button></p></div>`}
/* ---------- Calculadora ---------- */
let ce='';function tgl(){const p=document.getElementById('cp');p.style.display=p.style.display==='block'?'none':'block'}
function cp(k){if(ce==='erro')ce='';if(k==='C')ce='';else if(k==='<')ce=ce.slice(0,-1);else if(k==='='){try{if(/^[0-9+\-*\/.() ]+$/.test(ce)&&ce)ce=String(+(Function('return '+ce)()).toFixed(4))}catch(e){ce='erro'}}
else if(k==='%'){const x=ce.match(/(\d+\.?\d*)$/);if(x)ce=ce.slice(0,x.index)+(parseFloat(x[1])/100)}else ce+=k;document.getElementById('cd').textContent=ce||'0'}
document.getElementById('ck').innerHTML=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','%','+','C','<','(',')','='].map(k=>`<button class="${'/*-+='.includes(k)?'':'s'}" onclick="cp('${k}')">${k}</button>`).join('');
msg=ONLINE||PROF?'':(typeof firebase==='undefined'?'Modo individual (sem Firebase).':'');
boot(()=>{if(ONLINE&&!PROF&&SALA){const c=ls('mv_g_'+SALA);me.n=ls('mv_me')||'';if(c){db.ref('mv/'+SALA+'/grupos/'+c).once('value').then(sn=>{if(sn.exists()){db.ref('mv/'+SALA+'/grupos/'+c+'/membros/'+uid).set({n:me.n||'Aluno'}).then(()=>attach(SALA,c))}else draw()});return}}draw()});
</script></body></html>
